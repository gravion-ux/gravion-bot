name: CI
on:
  push:
  pull_request:
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile web server
        run: python3 -m py_compile web/server.py
      - name: Smoke test web health endpoint
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, time, urllib.request
          proc = subprocess.Popen([sys.executable, "web/server.py"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          try:
              data = None
              for _ in range(30):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8765/api/health", timeout=2) as r:
                          data = json.load(r)
                      break
                  except Exception:
                      time.sleep(0.5)
              assert data is not None, "server did not start"
              assert data.get("ok") is True, data
              print("health ok")
          finally:
              proc.terminate()
          PY
